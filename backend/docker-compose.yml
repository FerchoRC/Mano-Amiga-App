services:
  postgres:
    image: postgres:16-alpine
    container_name: mano-amiga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manoamiga
      POSTGRES_USER: manoamiga
      POSTGRES_PASSWORD: manoamiga
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
